# Moments cards on their own, in any dashboard.
# Add card → Manual, then paste one block.

# Alerts that only appear when something needs you: open doors and windows,
# problem, moisture, smoke and gas sensors, low batteries, finished appliances.
type: custom:moments-chips
battery_threshold: 15          # percent; batteries below this get a chip
exclude:                       # entities that never get a chip
  - binary_sensor.garage_side_door
finished:
  - entity: sensor.dishwasher_status
    state: complete
    name: Dishwasher

---
# Everything that is on or open, with one-tap off and "All lights off".
type: custom:moments-on-now
domains: [light, switch, fan, cover]   # which kinds of entity to list
exclude:
  - switch.fridge

---
# Scene and script buttons, ordered by time of day and daylight.
# Takes the same `intents` list as the dashboard (see dashboard.yaml).
type: custom:moments-intents
time_of_day_entity: input_select.time_of_day
illuminance_entity: sensor.outdoor_motion_illuminance
dark_below: 50
area: living_room        # optional: only this room's intents
include_house: true      # with area: also show house-level intents
intents:
  - entity: scene.movie
    name: Movie
    icon: mdi:movie-open
    when: [evening, night]
  - entity: script.bedtime
    when: [night]

---
# Greeting, time, weather and indoor temperature. Updates every minute.
type: custom:moments-header
time_of_day_entity: input_select.time_of_day
illuminance_entity: sensor.outdoor_motion_illuminance   # adds "dark outside"
weather_entity: weather.home
temperature_entity: sensor.hallway_temperature
area: kitchen                   # optional room label
schedules_path: schedules       # optional: clock icon opening this view

---
# Scheduled automations you can adjust. Same schedule options as the
# dashboard (see dashboard.yaml and schedules.yaml).
type: custom:moments-schedules
all: true                       # or `area: bedroom_1`; without either, house-level only
schedules:
  - name: Wake up
    automation: automation.schedule_wake_up
    time_entity: input_datetime.wake_up_time
    area: bedroom_1
  - name: Outside lights on
    automation: automation.schedule_outside_lights_on
    sun: sunset
    offset_entity: input_number.outside_lights_offset

---
# One quiet summary line ("2 schedules · next 07:00") linking to a view.
type: custom:moments-schedules
area: bedroom_1
summary: true
path: schedules
schedules:
  - name: Wake up
    automation: automation.schedule_wake_up
    time_entity: input_datetime.wake_up_time
    area: bedroom_1

---
# Today in detail, then the next days: condition icon, rain, wind and gusts,
# and a low-to-high bar on one shared scale.
type: custom:moments-weather
entity: weather.home
days: 7              # 0 to 7 days after today
gust_warn: 50        # gusts at or above this are highlighted (entity's wind unit)

---
# Room and outdoor temperatures: now, today's range and trend, and a chart.
type: custom:moments-temperatures
title: Temperatures
outside: sensor.outdoor_motion_temperature
hours: 24            # chart length; 0 hides the chart
rooms:
  - entity: sensor.living_room_temperature
    name: Living room
  - sensor.bedroom_temperature

---
# Today's outdoor light on a log scale against the dark line, with when it
# got dark or light. Use the same dark_below as your automations.
type: custom:moments-daylight
entity: sensor.outdoor_motion_illuminance
dark_below: 50

---
# Internet status, speeds, a chart of download speed and recent outages.
# online: a connectivity binary_sensor, e.g. from the Ping integration.
type: custom:moments-internet
online: binary_sensor.internet
download: sensor.speedtest_download
upload: sensor.speedtest_upload
ping: sensor.speedtest_ping
days: 7
outage_days: 30
max_outages: 5

---
# An appliance's program, progress and finish time, then its recent runs.
# Entity names below follow the Home Connect integration.
type: custom:moments-appliance
name: Dishwasher
status: sensor.dishwasher_operation_state
progress: sensor.dishwasher_program_progress
finish_time: sensor.dishwasher_program_finish_time
program: select.dishwasher_active_program
door: sensor.dishwasher_door
energy: sensor.dishwasher_plug_energy    # optional: adds kWh per run
running_states: [run, pause, delayedstart]
finished_states: [finished]
days: 14
max_runs: 5
