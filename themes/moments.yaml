# The Moments theme: dark, layered tiles with warm amber for "on".
# Install: copy to /config/themes/moments.yaml, make sure configuration.yaml has
#   frontend:
#     themes: !include_dir_merge_named themes
# then run "Reload themes" (Developer tools → Actions → frontend.reload_themes).
# The example dashboard applies it with `theme: moments` on each view, so the
# rest of Home Assistant keeps your usual theme.
moments:
  ha-card-border-radius: "22px"
  ha-card-box-shadow: "none"
  ha-card-border-width: "1px"
  modes:
    dark:
      primary-background-color: "#0d0f14"
      secondary-background-color: "#14171d"
      lovelace-background: "#0d0f14"
      card-background-color: "#181b22"
      ha-card-background: "#181b22"
      ha-card-border-color: "#232731"
      primary-text-color: "#eef0f4"
      secondary-text-color: "#9aa1ad"
      disabled-text-color: "#5f6672"
      divider-color: "#232731"
      primary-color: "#f2a33a"
      accent-color: "#f2a33a"
      state-light-active-color: "#f2a33a"
      error-color: "#ff6b5b"
      warning-color: "#f4b555"
      success-color: "#5fd3a0"
      info-color: "#6fb6ff"
      app-header-background-color: "#0d0f14"
      app-header-text-color: "#eef0f4"
      sidebar-background-color: "#0d0f14"
      moments-theme-blue: "#6fb6ff"
      moments-theme-teal: "#5fd3b5"
      moments-theme-purple: "#b49bff"
      moments-theme-pink: "#f08ab8"
      moments-theme-sun: "#f6b544"
      moments-theme-moon: "#c9cfdb"
      moments-theme-cloud: "#dfe3ea"
    light:
      primary-background-color: "#eef0f3"
      secondary-background-color: "#e6e9ed"
      lovelace-background: "#eef0f3"
      card-background-color: "#ffffff"
      ha-card-background: "#ffffff"
      ha-card-border-color: "#e3e6ea"
      primary-text-color: "#1c1f24"
      secondary-text-color: "#5f6672"
      divider-color: "#e3e6ea"
      primary-color: "#d9820a"
      accent-color: "#d9820a"
      state-light-active-color: "#e8930c"
      error-color: "#d9442e"
      warning-color: "#c77700"
      success-color: "#2e9d5b"
      info-color: "#2f7bd6"
      app-header-background-color: "#eef0f3"
      app-header-text-color: "#1c1f24"
      moments-theme-blue: "#2f7bd6"
      moments-theme-teal: "#1f9c7e"
      moments-theme-purple: "#7a5bd6"
      moments-theme-pink: "#c94d86"
      moments-theme-sun: "#e8930c"
      moments-theme-moon: "#8b93a3"
      moments-theme-cloud: "#9aa3b2"
